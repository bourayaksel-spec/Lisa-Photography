<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>More Work | Lisa Michelle Visuals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="logo">
            Lisa Michelle Visuals
        </div>

        <nav class="main-nav">

            <a href="index.html">HOME</a>

            <a href="index.html#portfolio">PORTFOLIO</a>

        </nav>

    </header>


    <main>

        <section class="more-work-page">

            <div class="portfolio-header">

                <p class="section-label">
                    MORE WORK
                </p>

                <h1>
                    More stories in frames.
                </h1>

                <p>
                    Explore more of Lisa's photography.
                </p>

            </div>


         <div class="portfolio-filters">

    <button class="filter-btn active" data-filter="all">
        ALL
    </button>

    <button class="filter-btn" data-filter="portraits">
        PORTRAITS
    </button>

    <button class="filter-btn" data-filter="couples">
        COUPLES
    </button>

    <button class="filter-btn" data-filter="sports">
        SPORTS
    </button>

    <button class="filter-btn" data-filter="landscapes">
        LANDSCAPES
    </button>

    <button class="filter-btn" data-filter="real-estate">
        REAL ESTATE
    </button>

    <button class="filter-btn" data-filter="lifestyle">
        LIFESTYLE
    </button>

</div>


<div class="gallery">

    <div class="gallery-item" data-category="portraits">
        <img
            src="images/12.webp"
            alt="Portrait photography by Lisa Michelle Visuals">
    </div>

    <div class="gallery-item" data-category="couples lifestyle">
        <img
            src="images/13.webp"
            alt="Couples photography by Lisa Michelle Visuals">
    </div>

    <div class="gallery-item" data-category="sports">
        <img
            src="images/14.webp"
            alt="Sports photography by Lisa Michelle Visuals">
    </div>

    <div class="gallery-item" data-category="landscapes">
        <img
            src="images/15.webp"
            alt="Landscape photography by Lisa Michelle Visuals">
    </div>

    <div class="gallery-item" data-category="real-estate">
        <img
            src="images/16.webp"
            alt="Real estate photography by Lisa Michelle Visuals">
    </div>

    <div class="gallery-item" data-category="lifestyle">
        <img
            src="images/17.webp"
            alt="Lifestyle photography by Lisa Michelle Visuals">
    </div>

</div>

        </section>

    </main>
<div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <button id="prev" class="lightbox-arrow left">
        &#10094;
    </button>

   <div class="lightbox-counter" id="lightbox-counter">
    1 / 1
</div>

<img
    id="lightbox-image"
    src=""
    alt="Lisa Michelle Visuals"
>

    <button id="next" class="lightbox-arrow right">
        &#10095;
    </button>

</div>
<script src="./more-work.js"></script>
</body>
</html>

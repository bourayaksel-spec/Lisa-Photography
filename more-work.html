<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>More Work | Lisa Michelle Visuals</title>

    <meta
        name="description"
        content="Explore more photography work by Lisa Michelle Visuals, including portraits, couples, sports, landscapes, real estate and lifestyle photography."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        Lisa Michelle Visuals
    </div>

    <nav class="main-nav">

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >
            ☰
        </button>

        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="index.html#portfolio">
                PORTFOLIO
            </a>

        </div>

    </nav>

</header>


<main>

<section class="more-work-page">

    <div class="portfolio-header">

        <p class="section-label">
            MORE WORK
        </p>

        <h1>
            More stories in frames.
        </h1>

        <p>
            Explore more of Lisa's photography.
        </p>

    </div>


    <!-- =========================
         PORTFOLIO FILTERS
    ========================== -->

    <div class="portfolio-filters">

        <button
            class="filter-btn active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>

        <button
            class="filter-btn"
            data-filter="portraits"
            type="button"
        >
            PORTRAITS
        </button>

        <button
            class="filter-btn"
            data-filter="couples"
            type="button"
        >
            COUPLES
        </button>

        <button
            class="filter-btn"
            data-filter="sports"
            type="button"
        >
            SPORTS
        </button>

        <button
            class="filter-btn"
            data-filter="landscapes"
            type="button"
        >
            LANDSCAPES
        </button>

        <button
            class="filter-btn"
            data-filter="real-estate"
            type="button"
        >
            REAL ESTATE
        </button>

        <button
            class="filter-btn"
            data-filter="lifestyle"
            type="button"
        >
            LIFESTYLE
        </button>

    </div>


    <!-- =========================
         SUPABASE GALLERY
    ========================== -->

    <div
        class="gallery"
        id="portfolio-gallery"
    >

        <!-- Images will be loaded from Supabase -->

    </div>


    <!-- Loading message -->

    <div
        id="gallery-loading"
        class="gallery-message"
    >
        Loading more work...
    </div>


    <!-- Error message -->

    <div
        id="gallery-error"
        class="gallery-message"
        style="display:none;"
    >
        Unable to load the portfolio right now.
        Please try again later.
    </div>


    <!-- Empty message -->

    <div
        id="gallery-empty"
        class="gallery-message"
        style="display:none;"
    >
        No photographs are available yet.
    </div>

</section>

</main>


<!-- =========================
     LIGHTBOX
========================== -->

<div
    id="lightbox"
    class="lightbox"
    aria-hidden="true"
>

    <span
        class="close"
        aria-label="Close"
    >
        &times;
    </span>


    <button
        id="prev"
        class="lightbox-arrow left"
        type="button"
        aria-label="Previous image"
    >
        &#10094;
    </button>


    <div
        class="lightbox-counter"
        id="lightbox-counter"
    >
        1 / 1
    </div>


    <img
        id="lightbox-image"
        src=""
        alt="Lisa Michelle Visuals"
    >


    <button
        id="next"
        class="lightbox-arrow right"
        type="button"
        aria-label="Next image"
    >
        &#10095;
    </button>

</div>


<script src="./more-work.js"></script>

</body>
</html>

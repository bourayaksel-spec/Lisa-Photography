const client =

===================================================== */

                email:
                    emailInput.value.trim(),

                password:
                    passwordInput.value

            });


        if (loginResult.error) {

            console.error(
                loginResult.error
            );

            result.textContent =
                "LOGIN ERROR\n\n" +
                loginResult.error.message;

            return;
        }


        result.textContent =
            "LOGIN SUCCESS\n\n" +

            "User ID:\n" +
            loginResult.data.user.id +

            "\n\nEmail:\n" +
            loginResult.data.user.email +

            "\n\nSession exists: YES";


        clientsButton.disabled = false;
        galleriesButton.disabled = false;
        photosButton.disabled = false;

    }
);

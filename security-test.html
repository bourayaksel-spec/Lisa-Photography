```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Security Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        input,
        button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        pre {
            margin-top: 25px;
            padding: 20px;
            background: #111;
            color: #eee;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Security Test</h1>

    <p>
        Temporary security testing page.
    </p>


    <input
        id="email"
        type="email"
        value="belal@gmail.com"
        placeholder="Email"
        autocomplete="username"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button id="loginButton">
        LOGIN TEST ACCOUNT
    </button>


    <button
        id="readButton"
        disabled
    >
        TEST PORTFOLIO SETTINGS READ
    </button>


    <pre id="result">Waiting for login...</pre>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


/* =====================================================
   CREATE CLIENT
===================================================== */

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginButton =
    document.getElementById("loginButton");

const readButton =
    document.getElementById("readButton");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const result =
    document.getElementById("result");


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    async () => {

        result.textContent =
            "Logging in...";


        const loginResult =
            await client.auth.signInWithPassword({

                email:
                    emailInput.value.trim(),

                password:
                    passwordInput.value

            });


        if (loginResult.error) {

            console.error(
                loginResult.error
            );

            result.textContent =
                "LOGIN ERROR\n\n" +
                loginResult.error.message;

            return;
        }


        result.textContent =
            "LOGIN SUCCESS\n\n" +

            "User ID:\n" +
            loginResult.data.user.id +

            "\n\nEmail:\n" +
            loginResult.data.user.email +

            "\n\nSession exists: YES";


        readButton.disabled = false;

    }
);


/* =====================================================
   READ PORTFOLIO SETTINGS
===================================================== */

readButton.addEventListener(
    "click",
    async () => {

        result.textContent =
            "Testing portfolio_settings READ...";


        const readResult =
            await client
                .from("portfolio_settings")
                .select("id, title")
                .limit(10);


        console.log(
            "READ DATA:",
            readResult.data
        );

        console.log(
            "READ ERROR:",
            readResult.error
        );


        result.textContent =
            "PORTFOLIO SETTINGS READ TEST\n\n" +

            "DATA:\n" +

            JSON.stringify(
                readResult.data,
                null,
                2
            ) +

            "\n\nERROR:\n" +

            JSON.stringify(
                readResult.error,
                null,
                2
            );

    }
);

</script>

</body>

</html>
```

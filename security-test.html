<body>

<div class="container">

    <h1>Security Test</h1>

    <p>
        Temporary security testing page.
    </p>


    <input
        id="email"
        type="email"
        value="belal@gmail.com"
        placeholder="Email"
        autocomplete="username"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button id="loginButton">
        LOGIN TEST ACCOUNT
    </button>


    <button
        id="updateButton"
        disabled
    >
        TEST PORTFOLIO SETTINGS UPDATE
    </button>


    <pre id="result">Waiting for login...</pre>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginButton =
    document.getElementById("loginButton");

const updateButton =
    document.getElementById("updateButton");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const result =
    document.getElementById("result");


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    async () => {

        result.textContent =
            "Logging in...";


        const loginResult =
            await client.auth.signInWithPassword({

                email:
                    emailInput.value.trim(),

                password:
                    passwordInput.value

            });


        if (loginResult.error) {

            console.error(
                loginResult.error
            );

            result.textContent =
                "LOGIN ERROR\n\n" +
                loginResult.error.message;

            return;
        }


        result.textContent =
            "LOGIN SUCCESS\n\n" +

            "User ID:\n" +
            loginResult.data.user.id +

            "\n\nEmail:\n" +
            loginResult.data.user.email +

            "\n\nSession exists: YES\n\n" +

            "You can now run the UPDATE test.";


        updateButton.disabled = false;

    }
);


/* =====================================================
   TEST PORTFOLIO SETTINGS UPDATE
===================================================== */

updateButton.addEventListener(
    "click",
    async () => {

        result.textContent =
            "Running RLS UPDATE test...\n\n" +
            "Target: portfolio_settings.id = 3";


        /*
         * First read the current value
         */

        const beforeResult =
            await client
                .from("portfolio_settings")
                .select("id, title")
                .eq("id", 3)
                .single();


        if (beforeResult.error) {

            result.textContent =
                "FAILED TO READ TEST ROW\n\n" +
                JSON.stringify(
                    beforeResult.error,
                    null,
                    2
                );

            return;
        }


        const originalTitle =
            beforeResult.data.title;


        /*
         * Attempt UPDATE
         */

        const updateResult =
            await client
                .from("portfolio_settings")
                .update({
                    title: "SECURITY_TEST_TEMP"
                })
                .eq("id", 3)
                .select("id, title");


        /*
         * Read again
         */

        const afterResult =
            await client
                .from("portfolio_settings")
                .select("id, title")
                .eq("id", 3)
                .single();


        /*
         * Display result
         */

        result.textContent =

            "RLS UPDATE SECURITY TEST\n\n" +

            "ORIGINAL VALUE:\n" +

            JSON.stringify(
                beforeResult.data,
                null,
                2
            ) +

            "\n\nUPDATE RESPONSE:\n" +

            JSON.stringify(
                updateResult,
                null,
                2
            ) +

            "\n\nVALUE AFTER UPDATE:\n" +

            JSON.stringify(
                afterResult.data,
                null,
                2
            );


        console.log(
            "Original:",
            beforeResult.data
        );

        console.log(
            "Update:",
            updateResult
        );

        console.log(
            "After:",
            afterResult.data
        );

    }
);


</script>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lisa Michelle Visuals — Client Gallery Manager</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #242424 0%,
                    #151515 42%,
                    #0b0b0b 100%
                );

            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            position: relative;
            overflow: hidden;
        }


        /* ================================
           BACKGROUND DETAILS
        ================================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -250px;
            right: -180px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.04);

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            bottom: -220px;
            left: -180px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.04);

            pointer-events: none;
        }


        /* ================================
           LOGIN CARD
        ================================= */

        .login-box {

            width: calc(100% - 40px);

            max-width: 440px;

            padding: 48px 42px 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35,35,35,.98),
                    rgba(20,20,20,.98)
                );

            border: 1px solid rgba(255,255,255,.09);

            border-radius: 2px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                0 0 0 1px rgba(255,255,255,.02);

            position: relative;

            z-index: 2;

            animation:
                cardAppear .7s ease forwards;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ================================
           TOP LINE
        ================================= */

        .top-line {

            width: 42px;
            height: 2px;

            background: #fff;

            margin-bottom: 28px;

            opacity: .85;
        }


        /* ================================
           BRAND
        ================================= */

        .brand {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            letter-spacing: .5px;

            margin: 0 0 8px;

            font-weight: 400;
        }


        .subtitle {

            margin: 0 0 36px;

            color: #999;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        /* ================================
           DIVIDER
        ================================= */

        .divider {

            width: 100%;

            height: 1px;

            background: rgba(255,255,255,.08);

            margin-bottom: 30px;
        }


        /* ================================
           FORM
        ================================= */

        .form-group {

            position: relative;

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #bdbdbd;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            background: rgba(0,0,0,.28);

            color: #fff;

            border: 1px solid #3b3b3b;

            border-radius: 1px;

            outline: none;

            font-size: 15px;

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }


        input::placeholder {

            color: #666;
        }


        input:hover {

            border-color: #555;
        }


        input:focus {

            border-color: #aaa;

            background: rgba(255,255,255,.035);

            box-shadow:
                0 0 0 3px rgba(255,255,255,.04);
        }


        /* ================================
           BUTTON
        ================================= */

        button {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            background: #fff;

            color: #111;

            border: none;

            border-radius: 1px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        button:hover {

            background: #e9e9e9;

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.35);
        }


        button:active {

            transform: translateY(0);
        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }


        /* ================================
           MESSAGE
        ================================= */

        #message {

            min-height: 22px;

            margin: 17px 0 0;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            color: #999;

            transition: opacity .2s ease;
        }


        /* ================================
           FOOTER
        ================================= */

        .footer {

            margin-top: 32px;

            padding-top: 22px;

            border-top: 1px solid rgba(255,255,255,.07);

            text-align: center;

            color: #555;

            font-size: 11px;

            letter-spacing: .8px;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            body {

                align-items: center;

                padding: 20px;
            }


            .login-box {

                width: 100%;

                padding:
                    38px
                    25px
                    30px;
            }


            .brand {

                font-size: 24px;
            }


            .subtitle {

                font-size: 11px;

                letter-spacing: 1.6px;

                margin-bottom: 30px;
            }

        }


        @media (max-width: 360px) {

            .login-box {

                padding:
                    32px
                    20px
                    25px;
            }

            .brand {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="top-line"></div>


    <h1 class="brand">
        Lisa Michelle Visuals
    </h1>


    <p class="subtitle">
        Client Gallery Manager
    </p>


    <div class="divider"></div>


    <form id="login-form">


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button type="submit">
            SIGN IN
        </button>


    </form>


    <p id="message"></p>


    <div class="footer">
        PRIVATE CLIENT ACCESS
    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const loginForm =
    document.getElementById("login-form");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        message.style.color = "#aaa";

        message.textContent =
            "Logging in...";


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


        if (error) {

            message.style.color =
                "#ff7777";

            message.textContent =
                error.message;

            return;
        }


        message.style.color =
            "#7cff7c";

        message.textContent =
            "Login successful!";


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 800);

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Lisa Photography</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            background-color: #f5f1eb;

            color: #222;

            font-family: Arial, sans-serif;

            padding: 30px;
        }

        .success {
            max-width: 700px;
        }

        .label {
            font-size: 12px;

            letter-spacing: 5px;

            color: #777;

            margin-bottom: 30px;
        }

        h1 {
            font-family: Georgia, serif;

            font-size: clamp(50px, 8vw, 90px);

            font-weight: normal;

            margin: 0 0 30px;
        }

        .message {
            font-size: 18px;

            line-height: 1.8;

            color: #666;

            margin-bottom: 45px;
        }

        .home-button {
            display: inline-block;

            padding: 16px 35px;

            background-color: #222;

            color: white;

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 2px;

            transition: 0.3s;
        }

        .home-button:hover {
            background-color: #555;

            transform: translateY(-3px);
        }

    </style>

</head>

<body>

    <main class="success">

        <p class="label">
            LISA PHOTOGRAPHY
        </p>

        <h1>
            Thank you.
        </h1>

        <p class="message">
            Your request has been received successfully.
            Lisa will get back to you as soon as possible.
        </p>

        <a href="index.html" class="home-button">
            BACK TO WEBSITE
        </a>

    </main>

</body>

</html>

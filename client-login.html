<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Login — Lisa Michelle Visuals</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-weight: 400;
            margin: 0 0 10px;
        }

        p {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #111;
            border: 1px solid #444;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: white;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .85;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .error {
            color: #ff7777;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Lisa Michelle Visuals</h1>

    <p>Private Client Gallery</p>

    <form id="login-form">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Your password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const message =
                document.getElementById("message");

            message.className = "";
            message.textContent =
                "Logging in...";


            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


            if (error) {

                message.className =
                    "error";

                message.textContent =
                    "Invalid email or password.";

                return;
            }


            window.location.href =
                "client-gallery.html";

        }
    );

</script>

</body>
</html>

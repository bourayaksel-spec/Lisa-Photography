<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lisa Michelle Visuals — Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px 5%;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 400;
        }

        #logout {
            background: transparent;
            color: white;
            border: 1px solid #555;
            padding: 10px 18px;
            cursor: pointer;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        h2 {
            font-size: 32px;
            font-weight: 400;
        }

        .card {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 30px;
            margin-bottom: 30px;
        }

        .client {
            padding: 20px 0;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .client:last-child {
            border-bottom: none;
        }

        .client-name {
            font-size: 20px;
        }

        button {
            padding: 12px 18px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .85;
        }

        #message {
            margin-top: 20px;
            color: #aaa;
        }

        .gallery-info {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }

        .gallery-link {
            display: inline-block;
            margin-top: 10px;
            color: white;
        }

        .error {
            color: #ff7777;
        }

        .success {
            color: #7cff7c;
        }

        @media (max-width: 600px) {

            .client {
                flex-direction: column;
                align-items: flex-start;
            }

            .client button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Lisa Michelle Visuals</h1>

    <button id="logout">
        LOGOUT
    </button>

</header>


<main>

    <h2>Client Gallery Manager</h2>

    <section class="card">

        <h3>Clients</h3>

        <div id="clients-list">
            Loading clients...
        </div>

    </section>

    <p id="message"></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* CHECK LOGIN */

async function checkUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "admin.html";

        return null;
    }

    return user;
}


/* LOAD CLIENTS */

async function loadClients() {

    const list =
        document.getElementById("clients-list");

    list.textContent = "Loading clients...";


    const {
        data,
        error
    } = await supabaseClient
        .from("clients")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        list.innerHTML =
            <p class="error">Error loading clients: ${error.message}</p>;

        return;
    }


    if (!data || data.length === 0) {

        list.textContent =
            "No clients yet.";

        return;
    }


    list.innerHTML = "";


    for (const client of data) {

        const div =
            document.createElement("div");

        div.className = "client";


        const name =
            document.createElement("div");

        name.className = "client-name";

        name.textContent =
            client.name;


        const button =
            document.createElement("button");

        button.textContent =
            "CREATE GALLERY";


        button.addEventListener(
            "click",
            () => createGallery(client)
        );


        div.appendChild(name);

        div.appendChild(button);

        list.appendChild(div);

    }

}


/* CREATE GALLERY */

async function createGallery(client) {

    const message =
        document.getElementById("message");

    message.className = "";
    message.textContent =
        "Creating gallery...";


    /*
        Create a simple URL-safe slug.
    */

    const slug =
        client.name
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");


    /*
        Create gallery in Supabase.
    */

    const {
        data,
        error
    } = await supabaseClient
        .from("galleries")
        .insert([
            {
                client_id: client.id,
                client_name: client.name,
                slug: slug
            }
        ])
        .select()
        .single();


    if (error) {

        message.className = "error";

        message.textContent =
            "Error creating gallery: " +
            error.message;

        return;
    }


    message.className = "success";

    message.textContent =
        "Gallery created successfully.";


    /*
        Show the new gallery information.
    */

    const galleryUrl =
        "gallery.html?gallery=" +
        encodeURIComponent(data.id);


    const info =
        document.createElement("div");

    info.className =
        "gallery-info";


    info.innerHTML = `
        <strong>${data.client_name}</strong>
        <br>
        Gallery created.
        <br>
        <a
            class="gallery-link"
            href="${galleryUrl}"
            target="_blank"
        >
            OPEN GALLERY
        </a>
    `;


    /*
        Add the result below the client list.
    */

    document
        .getElementById("clients-list")
        .appendChild(info);

}


/* LOGOUT */

document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "admin.html";

        }
    );


/* START */

(async function() {

    const user =
        await checkUser();

    if (user) {

        await loadClients();

    }

})();

</script>

</body>
</html>

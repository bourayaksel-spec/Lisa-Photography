<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lisa Michelle Visuals — Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px 5%;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 400;
        }

        #logout {
            background: transparent;
            color: white;
            border: 1px solid #555;
            padding: 10px 18px;
            cursor: pointer;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        h2 {
            font-size: 32px;
            font-weight: 400;
        }

        .card {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 30px;
            margin-bottom: 30px;
        }

        .add-client-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .add-client-form input {
            flex: 1;
            padding: 14px;
            border: 1px solid #444;
            background: #111;
            color: white;
        }

        .client {
            padding: 20px 0;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .client:last-child {
            border-bottom: none;
        }

        .client-name {
            font-size: 20px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .button-link {
            padding: 12px 18px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        button:hover,
        .button-link:hover {
            opacity: .85;
        }

        .secondary {
            background: transparent;
            color: white;
            border: 1px solid #555;
        }

        .upload-button {
            background: #ddd;
        }

        #message {
            margin-top: 20px;
            color: #aaa;
            line-height: 1.6;
        }

        .error {
            color: #ff7777;
        }

        .success {
            color: #7cff7c;
        }

        .hidden {
            display: none;
        }
.gallery-count {
    color: #aaa;
    font-size: 14px;
    margin-top: 6px;
}

.copy-button {
    background: transparent;
    color: white;
    border: 1px solid #555;
}
        @media (max-width: 600px) {

            .add-client-form {
                flex-direction: column;
            }

            .client {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
                flex-direction: column;
            }

            .actions button,
            .actions a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Lisa Michelle Visuals</h1>

    <button id="logout" class="secondary">
        LOGOUT
    </button>

</header>


<main>

    <h2>Client Gallery Manager</h2>


    <!-- ADD CLIENT -->

    <section class="card">

        <h3>Add Client</h3>

        <form id="add-client-form" class="add-client-form">

            <input
                type="text"
                id="client-name"
                placeholder="Client name"
                required
            >

            <button type="submit">
                ADD CLIENT
            </button>

        </form>

    </section>


    <!-- CLIENTS -->

    <section class="card">

        <h3>Clients</h3>

        <div id="clients-list">
            Loading clients...
        </div>

    </section>


    <p id="message"></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* CHECK LOGIN */

async function checkUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "admin.html";

        return null;
    }

    return user;
}


/* MESSAGE */

function showMessage(text, type = "") {

    const message =
        document.getElementById("message");

    message.className = type;

    message.textContent = text;
}


/* CREATE SLUG */

function createSlug(name) {

    return name
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}


/* ADD CLIENT */

async function addClient(event) {

    event.preventDefault();

    const input =
        document.getElementById("client-name");

    const clientName =
        input.value.trim();


    if (!clientName) {

        showMessage(
            "Please enter a client name.",
            "error"
        );

        return;
    }


    showMessage(
        "Creating client..."
    );


    /*
        Create client.
    */

    const {
        data: client,
        error: clientError
    } = await supabaseClient
        .from("clients")
        .insert([
            {
                name: clientName
            }
        ])
        .select()
        .single();


    if (clientError) {

        showMessage(
            "Error creating client: " +
            clientError.message,
            "error"
        );

        return;
    }


    /*
        Create gallery automatically.
    */

    const slug =
        createSlug(clientName);


    const {
        data: gallery,
        error: galleryError
    } = await supabaseClient
        .from("galleries")
        .insert([
            {
                client_id: client.id,
                client_name: clientName,
                slug: slug
            }
        ])
        .select()
        .single();


    if (galleryError) {

        showMessage(
            "Client created, but gallery creation failed: " +
            galleryError.message,
            "error"
        );

        return;
    }


    input.value = "";


    showMessage(
        "Client and private gallery created successfully.",
        "success"
    );


    await loadClients();
}


/* UPLOAD PHOTOS */

async function uploadPhotos(galleryId, fileInput) {

    const files =
        Array.from(fileInput.files);


    if (!files.length) {

        return;
    }


    showMessage(
        "Uploading " +
        files.length +
        " photo(s)..."
    );


    let uploaded = 0;


    for (const file of files) {

        try {

            /*
                Create a unique filename.
            */

            const extension =
                file.name.includes(".")
                    ? file.name.substring(
                        file.name.lastIndexOf(".")
                    )
                    : "";

            const baseName =
                file.name
                    .replace(/\.[^/.]+$/, "")
                    .replace(/[^a-zA-Z0-9_-]/g, "-");


            const uniqueName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 8) +
                "-" +
                baseName +
                extension;


            /*
                Upload to PRIVATE bucket.
            */

            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("client-galleries")
                .upload(
                    uniqueName,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


            if (uploadError) {

                throw uploadError;
            }


            /*
                Add photo record.
            */

            const {
                error: photoError
            } = await supabaseClient
                .from("gallery_photos")
                .insert([
                    {
                        gallery_id: galleryId,
                        file_name: file.name,
                        file_path: uniqueName
                    }
                ]);


            if (photoError) {

                /*
                    If database insert fails,
                    remove uploaded file.
                */

                await supabaseClient
                    .storage
                    .from("client-galleries")
                    .remove([uniqueName]);

                throw photoError;
            }


            uploaded++;

            showMessage(
                "Uploaded " +
                uploaded +
                " of " +
                files.length +
                " photo(s)..."
            );

        } catch (error) {

            console.error(
                "Upload error:",
                error
            );

            showMessage(
                "Upload error: " +
                error.message,
                "error"
            );

            fileInput.value = "";

            return;
        }
    }


    fileInput.value = "";


    showMessage(
        uploaded +
        " photo(s) uploaded successfully.",
        "success"
    );
}

async function copyGalleryLink(gallery) {

    const link =
        window.location.origin +
        "/Lisa-Photography/gallery.html?gallery=" +
        encodeURIComponent(gallery.id) +
        "&token=" +
        encodeURIComponent(gallery.access_token);

    try {

        await navigator.clipboard.writeText(link);

        showMessage(
            "Gallery link copied successfully.",
            "success"
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Could not copy the gallery link.",
            "error"
        );
    }
}
    
/* LOAD CLIENTS */

async function loadClients() {

    const list =
        document.getElementById("clients-list");

    list.textContent =
        "Loading clients...";


    const {
        data: clients,
        error: clientError
    } = await supabaseClient
        .from("clients")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (clientError) {

        list.innerHTML =
            `<p class="error">Error loading clients: ${clientError.message}</p>`;

        return;
    }


    if (!clients || clients.length === 0) {

        list.textContent =
            "No clients yet.";

        return;
    }


    /*
        Get galleries.
    */

    const {
        data: galleries,
        error: galleryError
    } = await supabaseClient
        .from("galleries")
        .select("*");


    if (galleryError) {

        list.innerHTML =
            `<p class="error">Error loading galleries: ${galleryError.message}</p>`;

        return;
    }

const {
    data: photos,
    error: photoError
} = await supabaseClient
    .from("gallery_photos")
    .select("gallery_id");

if (photoError) {

    list.innerHTML =
        `<p class="error">Error loading photos: ${photoError.message}</p>`;

    return;
}
    list.innerHTML = "";


clients.forEach(client => {

    const div =
        document.createElement("div");

    div.className =
        "client";


    const name =
        document.createElement("div");

    name.className =
        "client-name";

    name.textContent =
        client.name;
const clientGallery =
    galleries.find(
        gallery =>
            String(gallery.client_id).trim() ===
            String(client.id).trim()
    );

let photoCount = 0;

if (clientGallery) {
    photoCount =
        photos.filter(
            photo =>
                String(photo.gallery_id).trim() ===
                String(clientGallery.id).trim()
        ).length;
}

const photoInfo =
    document.createElement("div");

photoInfo.className =
    "gallery-count";

photoInfo.textContent =
    photoCount === 1
        ? "1 photo"
        : `${photoCount} photos`;

    

        const actions =
            document.createElement("div");

        actions.className =
            "actions";


        /*
            Find gallery.
        */

     


        if (clientGallery) {

            /*
                OPEN GALLERY
            */

            const openButton =
                document.createElement("a");

            openButton.className =
                "button-link";

            openButton.textContent =
                "OPEN GALLERY";

            openButton.href =
                "gallery.html?gallery=" +
                encodeURIComponent(
                    clientGallery.id
                );

            openButton.target =
                "_blank";


            actions.appendChild(
                openButton
            );
const copyButton =
    document.createElement("button");

copyButton.className =
    "copy-button";

copyButton.textContent =
    "COPY LINK";

copyButton.addEventListener(
    "click",
    () => copyGalleryLink(clientGallery)
);

actions.appendChild(
    copyButton
);

            /*
                UPLOAD PHOTOS
            */

            const uploadButton =
                document.createElement("button");

            uploadButton.className =
                "upload-button";

            uploadButton.textContent =
                "UPLOAD PHOTOS";


            const fileInput =
                document.createElement("input");

            fileInput.type =
                "file";

            fileInput.accept =
                "image/jpeg,image/png,image/webp,image/heic,image/heif";

            fileInput.multiple =
                true;

            fileInput.className =
                "hidden";


            uploadButton.addEventListener(
                "click",
                () => fileInput.click()
            );


            fileInput.addEventListener(
                "change",
                () => uploadPhotos(
                    clientGallery.id,
                    fileInput
                )
            );


            actions.appendChild(
                uploadButton
            );

            actions.appendChild(
                fileInput
            );


        } else {

            /*
                CREATE GALLERY
            */

            const createButton =
                document.createElement("button");

            createButton.textContent =
                "CREATE GALLERY";


            createButton.addEventListener(
                "click",
                () => createGallery(client)
            );


            actions.appendChild(
                createButton
            );

        }


name.appendChild(photoInfo);

div.appendChild(name);

div.appendChild(actions);

list.appendChild(div);

    });

}


/* CREATE GALLERY FOR EXISTING CLIENT */

async function createGallery(client) {

    showMessage(
        "Creating gallery..."
    );


    const slug =
        createSlug(client.name);


    const {
        data,
        error
    } = await supabaseClient
        .from("galleries")
        .insert([
            {
                client_id: client.id,
                client_name: client.name,
                slug: slug
            }
        ])
        .select()
        .single();


    if (error) {

        showMessage(
            "Error creating gallery: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Gallery created successfully.",
        "success"
    );


    await loadClients();
}


/* ADD CLIENT FORM */

document
    .getElementById("add-client-form")
    .addEventListener(
        "submit",
        addClient
    );


/* LOGOUT */

document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "admin.html";

        }
    );


/* START */

(async function() {

    const user =
        await checkUser();

    if (user) {

        await loadClients();

    }

})();

</script>

</body>
</html>

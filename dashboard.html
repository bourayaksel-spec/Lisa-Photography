        header {

        }


        header h1 {

        }

            padding: 30px;
            margin-bottom: 30px;

        .add-client-form {
            display: grid;

            grid-template-columns:

            gap: 10px;

            margin-top: 20px;
        }

        }

            padding: 12px 18px;

            background: white;
            color: black;

            font-weight: bold;

            text-decoration: none;

            display: inline-block;
        }


        button:hover,
        .button-link:hover {
            opacity: .85;
        }


        .secondary {

            background: transparent;
            color: white;

            border: 1px solid #555;
        }


        .danger {

            background: #7a2020;
            color: white;
        }


        .replace-button {

            background: #444;
            color: white;
        }


        .upload-button {

            background: #ddd;
            color: black;
        }


        .copy-button {

            background: transparent;
            color: white;

            border: 1px solid #555;
        }


        .client {

            padding: 25px 0;

            border-bottom: 1px solid #333;

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 25px;
        }


        .client:last-child {
            border-bottom: none;
        }


        .client-info {
            flex: 1;
            min-width: 0;
        }


        .client-name {

            font-size: 20px;
            margin-bottom: 5px;
        }


        .client-email {

            color: #888;
            font-size: 14px;
        }


        .gallery-count {

            color: #aaa;
            font-size: 14px;

            margin-top: 8px;
        }


        .actions {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .actions button,
        .actions a {
            white-space: nowrap;
        }


        .hidden {
            display: none;
        }


        #message {

            margin-top: 20px;

            color: #aaa;

            line-height: 1.6;
        }


        .error {
            color: #ff7777 !important;
        }


        .success {
            color: #7cff7c !important;
        }


        /* PHOTOS */


        .photos-section {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #333;
        }


        .photos-title {

            color: #aaa;

            font-size: 14px;

            margin-bottom: 15px;
        }


        .photos-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;
        }


        .photo-card {

            position: relative;

            background: #111;

            border: 1px solid #333;

            overflow: hidden;
        }


        .photo-card img {

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            cursor: pointer;
        }


        .photo-actions {

            display: flex;

            gap: 5px;

            padding: 7px;
        }


        .photo-actions button {

            flex: 1;

            padding: 8px 5px;

            font-size: 11px;
        }


        /* LIGHTBOX */


        .lightbox {

            display: none;

            position: fixed;

            inset: 0;

            background:

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 20px;

<script>


const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";


const SUPABASE_KEY =

const supabaseClient =

/* =====================================================
   MESSAGE
   ===================================================== */


function showMessage(
    text,
    type = ""
) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        type;


    message.textContent =
        text;
}


/* =====================================================
   CHECK LOGIN
   ===================================================== */


async function checkUser() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient
            .auth
            .getUser();


    if (!user) {

        window.location.href =
            "admin.html";

        return null;
    }


    return user;
}


/* =====================================================
   CREATE SLUG
   ===================================================== */


function createSlug(name) {

    return name
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            "");
}


/* =====================================================
   CREATE CLIENT
   ===================================================== */


async function addClient(event) {

    event.preventDefault();


    const nameInput =
        document.getElementById(
            "client-name"
        );


    const emailInput =
        document.getElementById(
            "client-email"
        );


    const passwordInput =
        document.getElementById(
            "client-password"
        );


    const name =
        nameInput.value.trim();


    const email =
        emailInput.value.trim();


    const password =
        passwordInput.value;


    if (
        !name ||
        !email ||
        !password
    ) {

        showMessage(
            "Please fill in all fields.",
            "error"
        );

        return;
    }


    if (
        password.length < 6
    ) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    showMessage(
        "Creating client account and gallery..."
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .functions
                .invoke(
                    "super-handler",
                    {
                        body: {
                            action:
                                "create_client",

                            name:
                                name,

                            email:
                                email,

                            password:
                                password
                        }
                    }
                );


        if (error) {

            console.error(
                "FUNCTION ERROR:",
                error
            );

            throw error;
        }


        if (
            !data ||
            !data.success
        ) {

            throw new Error(
                data?.error ||
                "Could not create client."
            );
        }


        nameInput.value = "";

        emailInput.value = "";

        passwordInput.value = "";


        showMessage(
            "Client, login account and gallery created successfully.",
            "success"
        );


        await loadClients();


    } catch (error) {

        console.error(
            "Create client error:",
            error
        );


        showMessage(
            "Error creating client: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   UPLOAD PHOTOS
   ===================================================== */


async function uploadPhotos(
    galleryId,
    fileInput
) {

    const files =
        Array.from(
            fileInput.files
        );


    if (
        files.length === 0
    ) {
        return;
    }


    showMessage(
        "Uploading " +
        files.length +
        " photo(s)..."
    );


    let uploaded = 0;


    for (
        const file of files
    ) {

        try {

            const extension =
                file.name.includes(".")
                    ? file.name.substring(
                        file.name.lastIndexOf(".")
                    )
                    : "";


            const baseName =
                file.name
                    .replace(
                        /\.[^/.]+$/,
                        ""
                    )
                    .replace(
                        /[^a-zA-Z0-9_-]/g,
                        "-"
                    );


            const uniqueName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        8
                    ) +
                "-" +
                baseName +
                extension;


            const {
                error:
                    uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "client-galleries"
                    )
                    .upload(
                        uniqueName,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false
                        }
                    );


            if (
                uploadError
            ) {
                throw uploadError;
            }


            const {
                error:
                    photoError
            } =
                await supabaseClient
                    .from(
                        "gallery_photos"
                    )
                    .insert([
                        {
                            gallery_id:
                                galleryId,

                            file_name:
                                file.name,

                            file_path:
                                uniqueName
                        }
                    ]);


            if (
                photoError
            ) {

                await supabaseClient
                    .storage
                    .from(
                        "client-galleries"
                    )
                    .remove([
                        uniqueName
                    ]);

                throw photoError;
            }


            uploaded++;


            showMessage(
                "Uploaded " +
                uploaded +
                " of " +
                files.length +
                " photo(s)..."
            );


        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            showMessage(
                "Upload error: " +
                error.message,
                "error"
            );


            fileInput.value =
                "";


            await loadClients();

            return;
        }
    }


    fileInput.value =
        "";


    showMessage(
        uploaded +
        " photo(s) uploaded successfully.",
        "success"
    );


    await loadClients();
}


/* =====================================================
   CREATE GALLERY
   ===================================================== */


async function createGallery(

    const slug =

        crypto.randomUUID();

    } =

            .from("galleries")

/* =====================================================

    const link =

        "/Lisa-Photography/client-login.html?gallery=" +
        encodeURIComponent(gallery.id);

    } catch (error) {

        console.error(error);

        showMessage(

/* =====================================================
   REPLACE PHOTO
   ===================================================== */


async function replacePhoto(photo) {

    const confirmed =
        confirm(
            `Replace "${photo.file_name}"?\n\n` +
            `The old photo will be permanently replaced.`
        );

    if (!confirmed) {
        return;
    }

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        "image/jpeg,image/png,image/webp,image/heic,image/heif";

    input.click();

    input.addEventListener(
        "change",
        async function () {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            showMessage(
                "Uploading replacement..."
            );

            try {

                /*
                 * IMPORTANT:
                 * Use the SAME storage path.
                 *
                 * This replaces the existing Storage
                 * object instead of creating a new path.
                 */

                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("client-galleries")
                        .upload(
                            photo.file_path,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: true,
                                contentType:
                                    file.type || "application/octet-stream"
                            }
                        );

                if (uploadError) {
                    throw uploadError;
                }


                /*
                 * Only update the file name.
                 *
                 * file_path stays exactly the same.
                 */

                const {
                    error: updateError
                } =
                    await supabaseClient
                        .from("gallery_photos")
                        .update({
                            file_name: file.name
                        })
                        .eq(
                            "id",
                            photo.id
                        );

                if (updateError) {
                    throw updateError;
                }


                showMessage(
                    "Photo replaced successfully.",
                    "success"
                );


                /*
                 * Reload clients and photos.
                 */

                await loadClients();


            } catch (error) {

                console.error(
                    "Replace photo error:",
                    error
                );

                showMessage(
                    "Error replacing photo: " +
                    error.message,
                    "error"
                );
            }

        }
    );
}

/* =====================================================
   LOAD CLIENTS
   ===================================================== */


async function loadClients() {

    const list =
        document.getElementById(
            "clients-list"
        );


    list.textContent =
        "Loading clients...";


    /*
        Clients
    */


    const {
        data: clients,
        error: clientError
    } =
        await supabaseClient
            .from("clients")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


    if (
        clientError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading clients:
                ${clientError.message}
            </p>`;

        return;
    }


    if (
        !clients ||
        clients.length === 0
    ) {

        list.textContent =
            "No clients yet.";

        return;
    }


    /*
        Galleries
    */


    const {
        data: galleries,
        error: galleryError
    } =
        await supabaseClient
            .from("galleries")
            .select("*");


    if (
        galleryError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading galleries:
                ${galleryError.message}
            </p>`;

        return;
    }


    /*
        Photos
    */


    const {
        data: photos,
        error: photoError
    } =
        await supabaseClient
            .from("gallery_photos")
            .select("*");


    if (
        photoError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading photos:
                ${photoError.message}
            </p>`;

        return;
    }


    list.innerHTML =
        "";


    /*
        CLIENT LOOP
    */


    for (
        const client of clients
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "client";


        const clientInfo =
            document.createElement(
                "div"
            );


        clientInfo.className =
            "client-info";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "client-name";


        name.textContent =
            client.name;


        const email =
            document.createElement(
                "div"
            );


        email.className =
            "client-email";


        email.textContent =
            client.email ||
            "";


        clientInfo.appendChild(
            name
        );


        clientInfo.appendChild(
            email
        );


        /*
            Find gallery
        */


        const clientGallery =
            galleries.find(
                gallery =>
                    String(
                        gallery.client_id
                    ).trim() ===
                    String(
                        client.id
                    ).trim()
            );


        let clientPhotos =
            [];


        if (
            clientGallery
        ) {

            clientPhotos =
                photos.filter(
                    photo =>
                        String(
                            photo.gallery_id
                        ).trim() ===
                        String(
                            clientGallery.id
                        ).trim()
                );
        }


        const photoInfo =
            document.createElement(
                "div"
            );


        photoInfo.className =
            "gallery-count";


        photoInfo.textContent =
            clientPhotos.length === 1
                ? "1 photo"
                : `${clientPhotos.length} photos`;


        clientInfo.appendChild(
            photoInfo
        );


        /*
            ACTIONS
        */


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "actions";


        if (
            clientGallery
        ) {

            /*
                OPEN GALLERY
            */


            const openButton =
                document.createElement(
                    "a"
                );


            openButton.className =
                "button-link";


            openButton.textContent =
                "OPEN GALLERY";


            openButton.href =
                "gallery.html?gallery=" +
                encodeURIComponent(
                    clientGallery.id
                ) +
                "&token=" +
                encodeURIComponent(
                    clientGallery.access_token
                );


            openButton.target =
                "_blank";


            actions.appendChild(
                openButton
            );


            /*
                COPY LINK
            */


            const copyButton =
                document.createElement(
                    "button"
                );


            copyButton.className =
                "copy-button";


            copyButton.textContent =
                "COPY LINK";


            copyButton.addEventListener(
                "click",
                () =>
                    copyGalleryLink(
                        clientGallery
                    )
            );


            actions.appendChild(
                copyButton
            );


            /*
                UPLOAD
            */


            const uploadButton =
                document.createElement(
                    "button"
                );


            uploadButton.className =
                "upload-button";


            uploadButton.textContent =
                "UPLOAD PHOTOS";


            const fileInput =
                document.createElement(
                    "input"
                );


            fileInput.type =
                "file";


            fileInput.accept =
                "image/jpeg,image/png,image/webp,image/heic,image/heif";


            fileInput.multiple =
                true;


            fileInput.className =
                "hidden";


            uploadButton.addEventListener(
                "click",
                () =>
                    fileInput.click()
            );


            fileInput.addEventListener(
                "change",
                () =>
                    uploadPhotos(
                        clientGallery.id,
                        fileInput
                    )
            );


            actions.appendChild(
                uploadButton
            );


            actions.appendChild(
                fileInput
            );

        } else {

            /*
                CREATE GALLERY
            */


            const createButton =
                document.createElement(
                    "button"
                );


            createButton.textContent =
                "CREATE GALLERY";


            createButton.addEventListener(
                "click",
                () =>
                    createGallery(
                        client
                    )
            );


            actions.appendChild(
                createButton
            );
        }


        /*
            DELETE CLIENT
        */


        const deleteClientButton =
            document.createElement(
                "button"
            );


        deleteClientButton.className =
            "danger";


        deleteClientButton.textContent =
            "DELETE CLIENT";


        deleteClientButton.addEventListener(
            "click",
            () =>
                deleteClient(
                    client
                )
        );


        actions.appendChild(
            deleteClientButton
        );


        div.appendChild(
            clientInfo
        );


        div.appendChild(
            actions
        );


        list.appendChild(
            div
        );


        /*
            PHOTOS SECTION
        */


        if (
            clientGallery &&
            clientPhotos.length > 0
        ) {

            const photosSection =
                document.createElement(
                    "div"
                );


            photosSection.className =
                "photos-section";


            const photosTitle =
                document.createElement(
                    "div"
                );


            photosTitle.className =
                "photos-title";


            photosTitle.textContent =
                "Gallery Photos";


            photosSection.appendChild(
                photosTitle
            );


            const photosGrid =
                document.createElement(
                    "div"
                );


            photosGrid.className =
                "photos-grid";


            for (
                const photo of clientPhotos
            ) {

                const photoCard =
                    document.createElement(
                        "div"
                    );


                photoCard.className =
                    "photo-card";


                const image =
                    document.createElement(
                        "img"
                    );


                image.alt =
                    photo.file_name ||
                    "Client photo";


                image.src =
                    "";


                const signedUrl =
                    await getSignedUrl(
                        photo.file_path
                    );


                if (
                    signedUrl
                ) {

                    image.src =
                        signedUrl;


                    image.addEventListener(
                        "click",
                        () =>
                            openLightbox(
                                signedUrl
                            )
                    );

                } else {

                    image.alt =
                        "Could not load image";

                    image.style.opacity =
                        ".3";
                }


                photoCard.appendChild(
                    image
                );


                /*
                    PHOTO ACTIONS
                */


                const photoActions =
                    document.createElement(
                        "div"
                    );


                photoActions.className =
                    "photo-actions";


                /*
                    REPLACE
                */


                const replaceButton =
                    document.createElement(
                        "button"
                    );


                replaceButton.className =
                    "replace-button";


                replaceButton.textContent =
                    "REPLACE";


                replaceButton.addEventListener(
                    "click",
                    () =>
                        replacePhoto(
                            photo
                        )
                );


                /*
                    DELETE
                */


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "danger";


                deleteButton.textContent =
                    "DELETE";


                deleteButton.addEventListener(
                    "click",
                    () =>
                        deletePhoto(
                            photo
                        )
                );


                photoActions.appendChild(
                    replaceButton
                );


                photoActions.appendChild(
                    deleteButton
                );


                photoCard.appendChild(
                    photoActions
                );


                photosGrid.appendChild(
                    photoCard
                );
            }


            photosSection.appendChild(
                photosGrid
            );


            list.appendChild(
                photosSection
            );
        }
    }
}


/* =====================================================
   ADD CLIENT FORM
   ===================================================== */


document
    .getElementById(
        "add-client-form"
    )
    .addEventListener(
        "submit",
        addClient
    );


/* =====================================================
   LOGOUT
   ===================================================== */


document
    .getElementById(
        "logout"
    )
    .addEventListener(
        "click",
        async function() {

            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "admin.html";
        }
    );

   START
   ===================================================== */


(async function() {

    const user =
        await checkUser();


    if (user) {

        await loadClients();
    }

})();


</script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lisa Michelle Visuals — Dashboard</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(255,255,255,.07),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 30%,
            rgba(255,255,255,.025),
            transparent 30%
        ),
        #090909;

    color: #fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    min-height: 76px;
    padding: 16px 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    background: rgba(9,9,9,.82);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,.08);
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-mark {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;

    font-family: Georgia, serif;
    font-size: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.025)
        );
}

.brand-text h1 {
    margin: 0;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 18px;
    font-weight: 400;

    letter-spacing: .04em;
}

.brand-text span {
    display: block;

    margin-top: 3px;

    color: #777;

    font-size: 9px;
    letter-spacing: .2em;

    text-transform: uppercase;
}


/* =====================================================
   MAIN
===================================================== */

main {
    width: 90%;
    max-width: 1280px;

    margin: 0 auto;

    padding: 55px 0 90px;
}

.hero {
    margin-bottom: 35px;
}

.eyebrow {
    margin: 0 0 12px;

    color: #777;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .22em;

    text-transform: uppercase;
}

main > .hero h2 {
    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(38px, 6vw, 64px);

    font-weight: 400;

    letter-spacing: -.04em;

    line-height: 1;
}

.hero-line {
    width: 65px;
    height: 2px;

    margin-top: 22px;

    background: #fff;
}


/* =====================================================
   STATS
===================================================== */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 25px;
}

.stat-card {
    position: relative;

    padding: 24px;

    min-height: 125px;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.2);

    transition:
        transform .25s ease,
        border-color .25s ease;
}

.stat-card::after {
    content: "";

    position: absolute;

    right: -30px;
    bottom: -45px;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.05);
}

.stat-card:hover {
    transform: translateY(-3px);

    border-color: rgba(255,255,255,.18);
}

.stat-label {
    color: #777;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .16em;

    text-transform: uppercase;
}

.stat-number {
    margin-top: 14px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 40px;

    font-weight: 400;

    line-height: 1;
}


/* =====================================================
   CARDS
===================================================== */

.card {
    position: relative;

    padding: 30px;

    margin-bottom: 25px;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.24);

    transition:
        border-color .25s ease;
}

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}

.card:hover {
    border-color: rgba(255,255,255,.14);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 5px;
}

h3 {
    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 26px;
    font-weight: 400;
}

.section-label {
    color: #666;

    font-size: 9px;
    letter-spacing: .18em;

    text-transform: uppercase;
}


/* =====================================================
   ADD CLIENT FORM
===================================================== */

.add-client-form {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        auto;

    gap: 12px;

    margin-top: 25px;
}

.add-client-form input {
    width: 100%;

    padding: 15px 16px;

    color: #fff;

    background: rgba(0,0,0,.42);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 10px;

    outline: none;

    font-size: 14px;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.add-client-form input::placeholder {
    color: #5f5f5f;
}

.add-client-form input:focus {
    background: rgba(255,255,255,.035);

    border-color: rgba(255,255,255,.35);

    box-shadow:
        0 0 0 3px rgba(255,255,255,.035);
}


/* =====================================================
   PASSWORD
===================================================== */

.password-wrapper {
    position: relative;

    width: 100%;
}

.password-wrapper input {
    padding-right: 52px;
}

.password-toggle {
    position: absolute !important;

    right: 5px;
    top: 50%;

    width: 40px !important;
    height: 40px !important;

    min-height: 40px !important;

    padding: 0 !important;
    margin: 0;

    transform: translateY(-50%);

    color: #777;

    background: transparent !important;

    border: none !important;

    border-radius: 8px;

    box-shadow: none !important;

    z-index: 10;
}

.password-toggle:hover {
    color: #fff;

    background: #252525 !important;

    transform: translateY(-50%);
}

.password-toggle svg {
    width: 20px;
    height: 20px;
}


/* =====================================================
   BUTTONS
===================================================== */

button,
.button-link {
    min-height: 44px;

    padding: 12px 18px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    color: #090909;

    background: #f3f3f3;

    border: 1px solid transparent;

    border-radius: 9px;

    cursor: pointer;

    text-decoration: none;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: .1em;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:hover,
.button-link:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

button:active,
.button-link:active {
    transform: translateY(0);
}


/* =====================================================
   BUTTON VARIANTS
===================================================== */

.secondary {
    color: #ddd;

    background: transparent;

    border-color: rgba(255,255,255,.16);
}

.secondary:hover {
    color: #fff;

    background: rgba(255,255,255,.07);

    border-color: rgba(255,255,255,.3);
}

.danger {
    color: #ffb7b7;

    background: rgba(75,20,20,.75);

    border-color: rgba(255,90,90,.18);
}

.danger:hover {
    background: #5a2020;
}

.replace-button {
    color: #ddd;

    background: #242424;

    border-color: #3b3b3b;
}

.replace-button:hover {
    background: #333;
}

.upload-button {
    color: #111;

    background: #dedede;
}

.upload-button:hover {
    background: #fff;
}

.copy-button {
    color: #ddd;

    background: transparent;

    border-color: rgba(255,255,255,.16);
}

.copy-button:hover {
    background: rgba(255,255,255,.07);
}


/* =====================================================
   CLIENT
===================================================== */

.client {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 25px;

    padding: 28px 0;

    border-bottom: 1px solid rgba(255,255,255,.075);

    transition:
        padding .25s ease;
}

.client:last-child {
    border-bottom: none;
}

.client:hover {
    padding-left: 7px;
}

.client-info {
    flex: 1;

    min-width: 0;
}

.client-name {
    margin-bottom: 6px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 24px;

    letter-spacing: -.01em;
}

.client-email {
    color: #777;

    font-size: 13px;

    word-break: break-word;
}

.gallery-count {
    display: inline-flex;

    margin-top: 12px;

    padding: 6px 10px;

    color: #aaa;

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.07);

    border-radius: 20px;

    font-size: 10px;

    letter-spacing: .06em;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions {
    display: flex;

    flex-wrap: wrap;

    justify-content: flex-end;

    gap: 8px;

    max-width: 620px;
}

.actions button,
.actions a {
    white-space: nowrap;
}


/* =====================================================
   PHOTOS
===================================================== */

.photos-section {
    margin-top: 25px;

    padding: 25px 0 0;

    border-top: 1px solid rgba(255,255,255,.08);
}

.photos-title {
    margin-bottom: 16px;

    color: #777;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .16em;

    text-transform: uppercase;
}

.photos-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.photo-card {
    overflow: hidden;

    background: #101010;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 11px;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.photo-card:hover {
    transform: translateY(-4px);

    border-color: rgba(255,255,255,.2);

    box-shadow:
        0 18px 40px rgba(0,0,0,.4);
}

.photo-card img {
    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    cursor: zoom-in;

    transition:
        transform .45s ease,
        opacity .25s ease;
}

.photo-card:hover img {
    transform: scale(1.04);
}

.photo-actions {
    display: flex;

    gap: 6px;

    padding: 8px;

    background:
        linear-gradient(
            180deg,
            rgba(22,22,22,.98),
            rgba(9,9,9,1)
        );
}

.photo-actions button {
    flex: 1;

    min-height: 34px;

    padding: 7px 5px;

    font-size: 9px;

    border-radius: 7px;
}


/* =====================================================
   MESSAGE
===================================================== */

#message {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 5000;

    width: max-content;

    max-width: calc(100% - 30px);

    margin: 0;
    padding: 13px 20px;

    transform: translateX(-50%);

    color: #aaa;

    background: rgba(18,18,18,.95);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 11px;

    font-size: 13px;

    line-height: 1.5;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    backdrop-filter: blur(16px);
}

.error {
    color: #ff8d8d !important;

    border-color: rgba(255,90,90,.25) !important;
}

.success {
    color: #9cffaa !important;

    border-color: rgba(100,255,130,.2) !important;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: rgba(0,0,0,.97);

    animation: fadeIn .2s ease;
}

.lightbox img {
    max-width: 95vw;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 4px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.8);
}

.lightbox-close {
    position: absolute;

    top: 18px;
    right: 28px;

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #fff;

    background: rgba(255,255,255,.08);

    border-radius: 50%;

    font-size: 32px;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}

.lightbox-close:hover {
    background: rgba(255,255,255,.16);

    transform: rotate(90deg);
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   UTILITY
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 950px) {

    .add-client-form {
        grid-template-columns:
            1fr
            1fr;
    }

    .add-client-form > button {
        width: 100%;
    }

    .photos-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .actions {
        max-width: 450px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    header {
        position: relative;

        min-height: 68px;

        padding: 14px 5%;
    }

    .brand-mark {
        width: 36px;
        height: 36px;

        font-size: 16px;
    }

    .brand-text h1 {
        font-size: 15px;
    }

    .brand-text span {
        display: none;
    }

    header .secondary {
        min-height: 38px;

        padding: 8px 13px;

        font-size: 9px;
    }

    main {
        width: 92%;

        padding:
            38px 0
            60px;
    }

    main > .hero h2 {
        font-size: 38px;

        line-height: 1.04;
    }

    .stats {
        grid-template-columns:
            1fr 1fr;

        gap: 10px;
    }

    .stat-card {
        min-height: 105px;

        padding: 18px;
    }

    .stat-card:last-child {
        grid-column: span 2;
    }

    .stat-number {
        font-size: 32px;
    }

    .card {
        padding: 20px;

        border-radius: 15px;
    }

    .card-header {
        align-items: flex-start;
    }

    h3 {
        font-size: 24px;
    }

    .add-client-form {
        grid-template-columns: 1fr;

        gap: 10px;
    }

    .client {
        flex-direction: column;

        gap: 18px;

        padding: 23px 0;
    }

    .client:hover {
        padding-left: 0;
    }

    .actions {
        width: 100%;

        max-width: none;

        justify-content: flex-start;
    }

    .actions button,
    .actions a {
        flex: 1;

        min-width: calc(50% - 5px);

        text-align: center;
    }

    .photos-grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 9px;
    }

    .photos-section {
        margin-top: 20px;

        padding-top: 20px;
    }

    .lightbox {
        padding: 10px;
    }

    .lightbox-close {
        top: 12px;
        right: 12px;

        width: 40px;
        height: 40px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 400px) {

    main > .hero h2 {
        font-size: 32px;
    }

    .actions button,
    .actions a {
        min-width: 100%;
    }

    .photos-grid {
        gap: 7px;
    }

    .photo-actions {
        flex-direction: column;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;

        transition-duration: .01ms !important;

        animation-duration: .01ms !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="brand">

        <div class="brand-mark">
            L
        </div>

        <div class="brand-text">

            <h1>
                Lisa Michelle Visuals
            </h1>

            <span>
                Gallery Management
            </span>

        </div>

    </div>


    <button
        id="logout"
        class="secondary"
    >
        LOGOUT
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <section class="hero">

        <p class="eyebrow">
            Private Studio Dashboard
        </p>

        <h2>
            Client Gallery
            <br>
            Manager
        </h2>

        <div class="hero-line"></div>

    </section>


    <!-- =================================================
         STATS
    ================================================= -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Clients
            </div>

            <div
                class="stat-number"
                id="stat-clients"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Galleries
            </div>

            <div
                class="stat-number"
                id="stat-galleries"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Photos
            </div>

            <div
                class="stat-number"
                id="stat-photos"
            >
                —
            </div>

        </div>

    </section>


    <!-- =================================================
         ADD CLIENT
    ================================================= -->

    <section class="card">

        <div class="card-header">

            <h3>
                Add Client
            </h3>

            <span class="section-label">
                New Gallery
            </span>

        </div>


        <form
            id="add-client-form"
            class="add-client-form"
        >

            <input
                type="text"
                id="client-name"
                placeholder="Client name"
                required
            >


            <input
                type="email"
                id="client-email"
                placeholder="Client email"
                required
            >


            <div class="password-wrapper">

                <input
                    type="password"
                    id="client-password"
                    placeholder="Temporary password"
                    minlength="6"
                    required
                >


                <button
                    type="button"
                    id="password-toggle"
                    class="password-toggle"
                    aria-label="Show password"
                >

                    <svg
                        id="password-eye"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </button>

            </div>


            <button type="submit">
                CREATE CLIENT
            </button>

        </form>

    </section>


    <!-- =================================================
         CLIENTS
    ================================================= -->

    <section class="card">

        <div class="card-header">

            <h3>
                Clients
            </h3>

            <span class="section-label">
                Gallery Library
            </span>

        </div>


        <div id="clients-list">
            Loading clients...
        </div>

    </section>


    <p id="message"></p>

</main>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    id="lightbox"
    class="lightbox"
>

    <span
        id="lightbox-close"
        class="lightbox-close"
    >
        &times;
    </span>


    <img
        id="lightbox-image"
        src=""
        alt="Photo"
    >

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = ""
) {

    const message =
        document.getElementById(
            "message"
        );

    message.className =
        type;

    message.textContent =
        text;
}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkUser() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient
            .auth
            .getUser();

    if (!user) {

        window.location.href =
            "admin.html";

        return null;
    }

    return user;
}


/* =====================================================
   CREATE SLUG
===================================================== */

function createSlug(name) {

    return name
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            "");
}


/* =====================================================
   CREATE CLIENT
===================================================== */

async function addClient(event) {

    event.preventDefault();

    const nameInput =
        document.getElementById(
            "client-name"
        );

    const emailInput =
        document.getElementById(
            "client-email"
        );

    const passwordInput =
        document.getElementById(
            "client-password"
        );

    const name =
        nameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if (
        !name ||
        !email ||
        !password
    ) {

        showMessage(
            "Please fill in all fields.",
            "error"
        );

        return;
    }

    if (
        password.length < 6
    ) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }

    showMessage(
        "Creating client account and gallery..."
    );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .functions
                .invoke(
                    "super-handler",
                    {
                        body: {
                            action:
                                "create_client",

                            name:
                                name,

                            email:
                                email,

                            password:
                                password
                        }
                    }
                );

        if (error) {

            console.error(
                "FUNCTION ERROR:",
                error
            );

            throw error;
        }

        if (
            !data ||
            !data.success
        ) {

            throw new Error(
                data?.error ||
                "Could not create client."
            );
        }

        nameInput.value = "";

        emailInput.value = "";

        passwordInput.value = "";

        showMessage(
            "Client, login account and gallery created successfully.",
            "success"
        );

        await loadClients();

    } catch (error) {

        console.error(
            "Create client error:",
            error
        );

        showMessage(
            "Error creating client: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   UPLOAD PHOTOS
===================================================== */

async function uploadPhotos(
    galleryId,
    fileInput
) {

    const files =
        Array.from(
            fileInput.files
        );

    if (
        files.length === 0
    ) {
        return;
    }

    showMessage(
        "Uploading " +
        files.length +
        " photo(s)..."
    );

    let uploaded = 0;

    for (
        const file of files
    ) {

        try {

            const extension =
                file.name.includes(".")
                    ? file.name.substring(
                        file.name.lastIndexOf(".")
                    )
                    : "";

            const baseName =
                file.name
                    .replace(
                        /\.[^/.]+$/,
                        ""
                    )
                    .replace(
                        /[^a-zA-Z0-9_-]/g,
                        "-"
                    );

            const uniqueName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        8
                    ) +
                "-" +
                baseName +
                extension;

            const {
                error:
                    uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "client-galleries"
                    )
                    .upload(
                        uniqueName,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false
                        }
                    );

            if (
                uploadError
            ) {
                throw uploadError;
            }

            const {
                error:
                    photoError
            } =
                await supabaseClient
                    .from(
                        "gallery_photos"
                    )
                    .insert([
                        {
                            gallery_id:
                                galleryId,

                            file_name:
                                file.name,

                            file_path:
                                uniqueName
                        }
                    ]);

            if (
                photoError
            ) {

                await supabaseClient
                    .storage
                    .from(
                        "client-galleries"
                    )
                    .remove([
                        uniqueName
                    ]);

                throw photoError;
            }

            uploaded++;

            showMessage(
                "Uploaded " +
                uploaded +
                " of " +
                files.length +
                " photo(s)..."
            );

        } catch (error) {

            console.error(
                "Upload error:",
                error
            );

            showMessage(
                "Upload error: " +
                error.message,
                "error"
            );

            fileInput.value =
                "";

            await loadClients();

            return;
        }
    }

    fileInput.value =
        "";

    showMessage(
        uploaded +
        " photo(s) uploaded successfully.",
        "success"
    );

    await loadClients();
}

        );

    if (!confirmed) {
        return;
    }

    showMessage(
        "Deleting photo..."
    );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .functions
                .invoke(
                    "super-handler",
                    {
                        body: {
                            action:
                                "delete_photo",

                            photo_id:
                                photo.id
                        }
                    }
                );

        if (error) {
            throw error;
        }

        if (
            !data ||
            !data.success
        ) {

                data?.error ||
                "Could not delete photo."
            );
        }

/* =====================================================
   REPLACE PHOTO
===================================================== */

async function replacePhoto(
    photo
) {

    const confirmed =
        confirm(
            `Replace "${photo.file_name}"?\n\nThe old photo will be permanently replaced.`
        );

    if (!confirmed) {
        return;
    }

    const input =
        document.createElement("input");

    input.type =
        "file";

    input.accept =
        "image/jpeg,image/png,image/webp,image/heic,image/heif";

    input.click();

    input.addEventListener(
        "change",
        async function () {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            showMessage(
                "Uploading replacement..."
            );

            try {

                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("client-galleries")
                        .upload(
                            photo.file_path,
                            file,
                            {
                                cacheControl: "3600",

                                upsert: true,

                                contentType:
                                    file.type ||
                                    "application/octet-stream"
                            }
                        );

                if (uploadError) {
                    throw uploadError;
                }

                const {
                    error: updateError
                } =
                    await supabaseClient
                        .from("gallery_photos")
                        .update({
                            file_name:
                                file.name
                        })
                        .eq(
                            "id",
                            photo.id
                        );

                if (updateError) {
                    throw updateError;
                }

                showMessage(
                    "Photo replaced successfully.",
                    "success"
                );

                await loadClients();

            } catch (error) {

                console.error(
                    "Replace photo error:",
                    error
                );

                showMessage(
                    "Error replacing photo: " +
                    error.message,
                    "error"
                );
            }

        }
    );
}


/* =====================================================

===================================================== */

async function deleteClient(

) {

            `• Client account\n` +
            `• Login account\n` +
            `• Gallery\n` +
            `• All photos\n\n` +
            `This action cannot be undone.`

    }

    if (
        secondConfirm !==
        "DELETE"
    ) {

        showMessage(
            "Deletion cancelled."
        );

        return;
    }

    showMessage(
        "Deleting client and all related files..."
    );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .functions
                .invoke(
                    "super-handler",
                    {
                        body: {
                            action:
                                "delete_client",

                            client_id:
                                client.id
                        }
                    }
                );

        if (error) {
            throw error;
        }

        if (
            !data ||
            !data.success
        ) {

            throw new Error(
                data?.error ||
                "Could not delete client."
            );
        }

        showMessage(
            "Client, gallery, photos and login account deleted successfully.",
            "success"
        );

        await loadClients();

    } catch (error) {

        console.error(
            "Delete client error:",
            error
        );

        showMessage(
            "Error deleting client: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   LOAD CLIENTS
===================================================== */

async function loadClients() {

    const list =
        document.getElementById(
            "clients-list"
        );

    list.textContent =
        "Loading clients...";

    const {
        data: clients,
        error: clientError
    } =
        await supabaseClient
            .from("clients")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );

    if (
        clientError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading clients:
                ${clientError.message}
            </p>`;

        return;
    }

    const {
        data: galleries,
        error: galleryError
    } =
        await supabaseClient
            .from("galleries")
            .select("*");

    if (
        galleryError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading galleries:
                ${galleryError.message}
            </p>`;

        return;
    }

    const {
        data: photos,
        error: photoError
    } =
        await supabaseClient
            .from("gallery_photos")
            .select("*");

    if (
        photoError
    ) {

        list.innerHTML =
            `<p class="error">
                Error loading photos:
                ${photoError.message}
            </p>`;

        return;
    }


    /* ================================================
       UPDATE STATISTICS
    ================================================= */

    document.getElementById(
        "stat-clients"
    ).textContent =
        clients?.length || 0;


    document.getElementById(
        "stat-galleries"
    ).textContent =
        galleries?.length || 0;


    document.getElementById(
        "stat-photos"
    ).textContent =
        photos?.length || 0;


    if (
        !clients ||
        clients.length === 0
    ) {

        list.textContent =
            "No clients yet.";

        return;
    }


    list.innerHTML =
        "";


    for (
        const client of clients
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "client";


        const clientInfo =
            document.createElement(
                "div"
            );

        clientInfo.className =
            "client-info";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "client-name";

        name.textContent =
            client.name;


        const email =
            document.createElement(
                "div"
            );

        email.className =
            "client-email";

        email.textContent =
            client.email ||
            "";


        clientInfo.appendChild(
            name
        );

        clientInfo.appendChild(
            email
        );


        const clientGallery =
            galleries.find(
                gallery =>
                    String(
                        gallery.client_id
                    ).trim() ===
                    String(
                        client.id
                    ).trim()
            );


        let clientPhotos =
            [];


        if (
            clientGallery
        ) {

            clientPhotos =
                photos.filter(
                    photo =>
                        String(
                            photo.gallery_id
                        ).trim() ===
                        String(
                            clientGallery.id
                        ).trim()
                );
        }


        const photoInfo =
            document.createElement(
                "div"
            );

        photoInfo.className =
            "gallery-count";

        photoInfo.textContent =
            clientPhotos.length === 1
                ? "1 photo"
                : `${clientPhotos.length} photos`;


        clientInfo.appendChild(
            photoInfo
        );


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "actions";


        if (
            clientGallery
        ) {

            const openButton =
                document.createElement(
                    "a"
                );

            openButton.className =
                "button-link";

            openButton.textContent =
                "OPEN GALLERY";

            openButton.href =
                "gallery.html?gallery=" +
                encodeURIComponent(
                    clientGallery.id
                ) +
                "&token=" +
                encodeURIComponent(
                    clientGallery.access_token
                );

            openButton.target =
                "_blank";


            actions.appendChild(
                openButton
            );


            const copyButton =
                document.createElement(
                    "button"
                );

            copyButton.className =
                "copy-button";

            copyButton.textContent =
                "COPY LINK";

            copyButton.addEventListener(
                "click",
                () =>
                    copyGalleryLink(
                        clientGallery
                    )
            );


            actions.appendChild(
                copyButton
            );


            const uploadButton =
                document.createElement(
                    "button"
                );

            uploadButton.className =
                "upload-button";

            uploadButton.textContent =
                "UPLOAD PHOTOS";


            const fileInput =
                document.createElement(
                    "input"
                );

            fileInput.type =
                "file";

            fileInput.accept =
                "image/jpeg,image/png,image/webp,image/heic,image/heif";

            fileInput.multiple =
                true;

            fileInput.className =
                "hidden";


            uploadButton.addEventListener(
                "click",
                () =>
                    fileInput.click()
            );


            fileInput.addEventListener(
                "change",
                () =>
                    uploadPhotos(
                        clientGallery.id,
                        fileInput
                    )
            );


            actions.appendChild(
                uploadButton
            );

            actions.appendChild(
                fileInput
            );


        } else {

            const createButton =
                document.createElement(
                    "button"
                );

            createButton.textContent =
                "CREATE GALLERY";

            createButton.addEventListener(
                "click",
                () =>
                    createGallery(
                        client
                    )
            );

            actions.appendChild(
                createButton
            );
        }


        const deleteClientButton =
            document.createElement(
                "button"
            );

        deleteClientButton.className =
            "danger";

        deleteClientButton.textContent =
            "DELETE CLIENT";

        deleteClientButton.addEventListener(
            "click",
            () =>
                deleteClient(
                    client
                )
        );


        actions.appendChild(
            deleteClientButton
        );


        div.appendChild(
            clientInfo
        );

        div.appendChild(
            actions
        );

        list.appendChild(
            div
        );


        /* ============================================
           PHOTOS
        ============================================ */

        if (
            clientGallery &&
            clientPhotos.length > 0
        ) {

            const photosSection =
                document.createElement(
                    "div"
                );

            photosSection.className =
                "photos-section";


            const photosTitle =
                document.createElement(
                    "div"
                );

            photosTitle.className =
                "photos-title";

            photosTitle.textContent =
                "Gallery Photos";


            photosSection.appendChild(
                photosTitle
            );


            const photosGrid =
                document.createElement(
                    "div"
                );

            photosGrid.className =
                "photos-grid";


            for (
                const photo of clientPhotos
            ) {

                const photoCard =
                    document.createElement(
                        "div"
                    );

                photoCard.className =
                    "photo-card";


                const image =
                    document.createElement(
                        "img"
                    );

                image.alt =
                    photo.file_name ||
                    "Client photo";

                image.src =
                    "";


                const signedUrl =
                    await getSignedUrl(
                        photo.file_path
                    );


                if (
                    signedUrl
                ) {

                    image.src =
                        signedUrl;

                    image.addEventListener(
                        "click",
                        () =>
                            openLightbox(
                                signedUrl
                            )
                    );

                } else {

                    image.alt =
                        "Could not load image";

                    image.style.opacity =
                        ".3";
                }


                photoCard.appendChild(
                    image
                );


                const photoActions =
                    document.createElement(
                        "div"
                    );

                photoActions.className =
                    "photo-actions";


                const replaceButton =
                    document.createElement(
                        "button"
                    );

                replaceButton.className =
                    "replace-button";

                replaceButton.textContent =
                    "REPLACE";


                replaceButton.addEventListener(
                    "click",
                    () =>
                        replacePhoto(
                            photo
                        )
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "danger";

                deleteButton.textContent =
                    "DELETE";


                deleteButton.addEventListener(
                    "click",
                    () =>
                        deletePhoto(
                            photo
                        )
                );


                photoActions.appendChild(
                    replaceButton
                );

                photoActions.appendChild(
                    deleteButton
                );


                photoCard.appendChild(
                    photoActions
                );


                photosGrid.appendChild(
                    photoCard
                );
            }


            photosSection.appendChild(
                photosGrid
            );


            list.appendChild(
                photosSection
            );
        }
    }
}

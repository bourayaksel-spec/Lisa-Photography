<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lisa Michelle Visuals — Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px 5%;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 400;
        }

        #logout {
            background: transparent;
            color: white;
            border: 1px solid #555;
            padding: 10px 18px;
            cursor: pointer;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h2 {
            font-size: 32px;
            font-weight: 400;
        }

        .card {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 30px;
            margin-bottom: 30px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 400;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0 15px;
            background: #111;
            border: 1px solid #444;
            color: white;
        }

        button {
            padding: 13px 20px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: .85;
        }

        #message {
            margin-top: 20px;
            color: #aaa;
        }

        .client {
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        .client:last-child {
            border-bottom: none;
        }

        .client-name {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>

    <h1>Lisa Michelle Visuals</h1>

    <button id="logout">
        LOGOUT
    </button>

</header>


<main>

    <div class="welcome">

        <h2>
            Client Gallery Manager
        </h2>

        <p>
            Manage your clients and private galleries.
        </p>

    </div>


    <!-- CREATE CLIENT -->

    <section class="card">

        <h3>
            Create New Client
        </h3>

        <form id="client-form">

            <input
                type="text"
                id="client-name"
                placeholder="Client name — e.g. Smith Family"
                required
            >

            <button type="submit">
                CREATE CLIENT
            </button>

        </form>

    </section>


    <!-- CLIENT LIST -->

    <section class="card">

        <h3>
            Clients
        </h3>

        <div id="clients-list">
            Loading clients...
        </div>

    </section>


    <p id="message"></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "ضع-PUBLISHABLE-KEY-هنا";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* CHECK LOGIN */

async function checkUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "admin.html";

        return null;
    }

    return user;
}


/* LOAD CLIENTS */

async function loadClients() {

    const list =
        document.getElementById("clients-list");

    const {
        data,
        error
    } = await supabaseClient
        .from("clients")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        list.textContent =
            "Error loading clients: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        list.textContent =
            "No clients yet.";

        return;
    }


    list.innerHTML = "";


    data.forEach(client => {

        const div =
            document.createElement("div");

        div.className = "client";


        const name =
            document.createElement("div");

        name.className = "client-name";

        name.textContent =
            client.name;


        div.appendChild(name);

        list.appendChild(div);

    });

}


/* CREATE CLIENT */

document
    .getElementById("client-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("client-name")
                .value
                .trim();


        if (!name) return;


        const message =
            document.getElementById("message");


        message.textContent =
            "Creating client...";


        const {
            error
        } = await supabaseClient
            .from("clients")
            .insert([
                {
                    name: name
                }
            ]);


        if (error) {

            message.textContent =
                "Error: " +
                error.message;

            return;
        }


        message.style.color =
            "#7cff7c";

        message.textContent =
            "Client created successfully.";


        document
            .getElementById("client-name")
            .value = "";


        loadClients();

    });


/* LOGOUT */

document
    .getElementById("logout")
    .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin.html";

    });


/* START */

(async function() {

    const user = await checkUser();

    if (user) {

        loadClients();

    }

})();

</script>

</body>
</html>

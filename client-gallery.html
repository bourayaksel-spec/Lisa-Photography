<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Gallery | Lisa Michelle Visuals</title>

    <meta
        name="description"
        content="Private client gallery by Lisa Michelle Visuals."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <div class="logo">
        Lisa Michelle Visuals
    </div>

</header>


<main class="client-gallery-page">

    <div class="client-gallery-header">

        <p class="section-label">
            PRIVATE CLIENT GALLERY
        </p>

       <h1 id="client-name">
    Your memories.
</h1>

<p>
    A private collection of photographs
    captured by Lisa Michelle Visuals.
</p>
    </div>


    <div class="client-gallery">

        <div class="client-photo">
            <img
                src="images/client-01.webp"
                alt="Client photograph"
            >
        </div>

        <div class="client-photo">
            <img
                src="images/client-02.webp"
                alt="Client photograph"
            >
        </div>

        <div class="client-photo">
            <img
                src="images/client-03.webp"
                alt="Client photograph"
            >
        </div>

        <div class="client-photo">
            <img
                src="images/client-04.webp"
                alt="Client photograph"
            >
        </div>

    </div>

</main>


<footer class="site-footer">

    <div class="footer-brand">

        <h3>
            Lisa Michelle Visuals
        </h3>

        <p>
            Photographer · Storyteller
        </p>

    </div>

    <div class="footer-bottom">

        <p>
            © <span class="current-year"></span>
            Lisa Michelle Visuals.
            All rights reserved.
        </p>

    </div>

</footer>


<script>

    /* Current year */

    document.querySelector(".current-year").textContent =
        new Date().getFullYear();


    /* Client name from URL */

    const params = new URLSearchParams(
        window.location.search
    );

    const client = params.get("client");

    const clientName =
        document.getElementById("client-name");


    if (client && clientName) {

        const formattedName = client
            .replace(/-/g, " ")
            .replace(/\b\w/g, function (letter) {
                return letter.toUpperCase();
            });

        clientName.textContent = formattedName;

    }

</script>

</body>

</html>

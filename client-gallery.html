<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Gallery | Lisa Michelle Visuals</title>

    <meta
        name="description"
        content="Private client gallery by Lisa Michelle Visuals."
    >

    <meta name="theme-color" content="#0b0b0b">

    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            min-height: 100vh;
        }

        button {
            font: inherit;
        }


        /* =========================
           HEADER
        ========================= */

        .site-header {
            text-align: center;
            padding: 58px 20px 42px;
            border-bottom: 1px solid rgba(255,255,255,.10);
        }

        .brand {
            margin: 0;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gallery-label {
            margin: 13px 0 0;
            color: #999;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: min(94%, 1400px);
            margin: 0 auto;
            padding: 70px 0 80px;
        }


        /* =========================
           CLIENT INTRO
        ========================= */

        .client-intro {
            text-align: center;
            margin-bottom: 58px;
        }

        .eyebrow {
            margin: 0 0 15px;
            color: #999;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #client-name {
            margin: 0;
            font-size: clamp(34px, 5vw, 58px);
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .intro-text {
            max-width: 600px;
            margin: 20px auto 0;
            color: #999;
            font-size: 15px;
            line-height: 1.8;
        }

        .gallery-meta {
            margin-top: 22px;
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {
            text-align: center;
            color: #aaa;
            padding: 35px 20px;
            font-size: 14px;
        }

        #message:empty {
            display: none;
        }

        .error {
            color: #d98b8b !important;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .photo-wrapper {
            position: relative;
            overflow: hidden;
            background: #151515;
            aspect-ratio: 4 / 3;
            cursor: pointer;
        }

        .photo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;

            opacity: 0;

            transition:
                transform .7s cubic-bezier(.2,.65,.2,1),
                opacity .5s ease,
                filter .5s ease;
        }

        .photo.loaded {
            opacity: 1;
        }

        .photo-wrapper:hover .photo {
            transform: scale(1.035);
            filter: brightness(.88);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: flex-end;
            justify-content: flex-end;

            padding: 18px;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.35),
                    transparent 40%
                );

            opacity: 0;

            transition: opacity .35s ease;

            pointer-events: none;
        }

        .photo-wrapper:hover .photo-overlay {
            opacity: 1;
        }

        .view-icon {
            width: 38px;
            height: 38px;

            border: 1px solid rgba(255,255,255,.65);
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
            color: white;

            backdrop-filter: blur(5px);
        }


        /* =========================
           LOADING PLACEHOLDER
        ========================= */

        .photo-wrapper.loading {
            background:
                linear-gradient(
                    110deg,
                    #111 30%,
                    #1b1b1b 45%,
                    #111 60%
                );

            background-size: 200% 100%;

            animation:
                shimmer 1.5s infinite;
        }

        @keyframes shimmer {

            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }

        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .logout {
            padding: 12px 26px;

            background: transparent;

            color: #aaa;

            border: 1px solid #444;

            cursor: pointer;

            letter-spacing: 2px;
            font-size: 10px;

            transition:
                background .3s ease,
                color .3s ease,
                border-color .3s ease;
        }

        .logout:hover {
            background: white;
            color: black;
            border-color: white;
        }


        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                rgba(0,0,0,.97);

            z-index: 9999;

            padding: 70px 70px 50px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 92vw;
            max-height: 82vh;

            object-fit: contain;

            user-select: none;

            box-shadow:
                0 20px 80px rgba(0,0,0,.65);
        }

        .lightbox-close {
            position: absolute;

            top: 22px;
            right: 30px;

            width: 48px;
            height: 48px;

            border: 1px solid rgba(255,255,255,.35);
            border-radius: 50%;

            background: rgba(0,0,0,.25);

            color: white;

            font-size: 30px;
            line-height: 1;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .3s ease,
                transform .3s ease;
        }

        .lightbox-close:hover {
            background: white;
            color: black;
            transform: rotate(90deg);
        }

        .lightbox-arrow {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.35);

            background: rgba(0,0,0,.3);

            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .3s ease,
                color .3s ease;
        }

        .lightbox-arrow:hover {
            background: white;
            color: black;
        }

        .lightbox-prev {
            left: 25px;
        }

        .lightbox-next {
            right: 25px;
        }

        .lightbox-counter {
            position: absolute;

            bottom: 22px;
            left: 50%;

            transform: translateX(-50%);

            color: #aaa;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 45px 20px;

            border-top:
                1px solid rgba(255,255,255,.08);

            color: #666;

            font-size: 11px;

            letter-spacing: 1px;
        }

        .footer-brand {
            color: #aaa;

            font-size: 12px;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .gallery {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 12px;
            }

        }


        @media (max-width: 600px) {

            .site-header {
                padding: 40px 20px 30px;
            }

            .brand {
                font-size: 19px;
                letter-spacing: 3px;
            }

            .gallery-label {
                font-size: 9px;
                letter-spacing: 3px;
            }

            main {
                width: 94%;
                padding: 48px 0 60px;
            }

            .client-intro {
                margin-bottom: 38px;
            }

            #client-name {
                font-size: 32px;
            }

            .intro-text {
                font-size: 14px;
                line-height: 1.7;
            }

            .gallery {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 6px;
            }

            .photo-wrapper {
                aspect-ratio: 1 / 1;
            }

            .photo-overlay {
                display: none;
            }

            .lightbox {
                padding: 60px 10px 55px;
            }

            .lightbox-image {
                max-width: 96vw;
                max-height: 80vh;
            }

            .lightbox-arrow {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }

            .lightbox-prev {
                left: 10px;
            }

            .lightbox-next {
                right: 10px;
            }

            .lightbox-close {
                top: 12px;
                right: 15px;

                width: 42px;
                height: 42px;
            }

        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <h1 class="brand">
        Lisa Michelle Visuals
    </h1>

    <p class="gallery-label">
        Private Client Gallery
    </p>

</header>


<main>

    <section class="client-intro">

        <p class="eyebrow">
            YOUR PRIVATE COLLECTION
        </p>

        <h2 id="client-name">
            Loading...
        </h2>

        <p class="intro-text">
            A collection of moments captured
            with care by Lisa Michelle Visuals.
        </p>

        <div
            id="gallery-meta"
            class="gallery-meta"
        ></div>

    </section>


    <div id="message"></div>


    <section
        id="gallery"
        class="gallery"
        aria-label="Client photographs"
    ></section>


    <div class="controls">

        <button
            id="logout"
            class="logout"
            type="button"
        >
            LOG OUT
        </button>

    </div>

</main>


<!-- LIGHTBOX -->

<div
    id="lightbox"
    class="lightbox"
    aria-hidden="true"
>

    <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="Close image"
    >
        &times;
    </button>


    <button
        id="lightbox-prev"
        class="lightbox-arrow lightbox-prev"
        type="button"
        aria-label="Previous image"
    >
        &#10094;
    </button>


    <img
        id="lightbox-image"
        class="lightbox-image"
        src=""
        alt="Client photograph"
    >


    <button
        id="lightbox-next"
        class="lightbox-arrow lightbox-next"
        type="button"
        aria-label="Next image"
    >
        &#10095;
    </button>


    <div
        id="lightbox-counter"
        class="lightbox-counter"
    >
        1 / 1
    </div>

</div>


<footer>

    <div class="footer-brand">
        Lisa Michelle Visuals
    </div>

    © <span id="year"></span>
    All rights reserved.

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://ilrdmzogaqfdrcyzjahk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MGbh1GVGc9Vl_dLYJGTplA_-PDqMiPJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const clientNameElement =
    document.getElementById("client-name");

const message =
    document.getElementById("message");

const gallery =
    document.getElementById("gallery");

const galleryMeta =
    document.getElementById("gallery-meta");

const logoutButton =
    document.getElementById("logout");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightbox-image");

const lightboxClose =
    document.getElementById("lightbox-close");

const lightboxPrev =
    document.getElementById("lightbox-prev");

const lightboxNext =
    document.getElementById("lightbox-next");

const lightboxCounter =
    document.getElementById("lightbox-counter");


/* ==========================================
   STATE
========================================== */

let galleryPhotos = [];

let currentPhotoIndex = 0;


/* ==========================================
   YEAR
========================================== */

document.getElementById("year")
    .textContent =
        new Date().getFullYear();


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(
    text,
    isError = false
) {

    message.textContent = text;

    message.className =
        isError
            ? "error"
            : "";

}


/* ==========================================
   LOAD CLIENT GALLERY
========================================== */

async function loadClientGallery() {

    showMessage(
        "Loading your private gallery..."
    );


    /* --------------------------------------
       1. AUTH USER
    -------------------------------------- */

    const {
        data: {
            user
        },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();


    console.log(
        "AUTH USER:",
        user
    );

    console.log(
        "AUTH ERROR:",
        userError
    );


    if (
        userError ||
        !user
    ) {

        window.location.href =
            "client-login.html";

        return;

    }


    /* --------------------------------------
       2. CLIENT
    -------------------------------------- */

    const {
        data: client,
        error: clientError
    } =
        await supabaseClient
            .from("clients")
            .select(
                "id, name, email, user_id"
            )
            .eq(
                "user_id",
                user.id
            )
            .single();


    console.log(
        "CLIENT:",
        client
    );

    console.log(
        "CLIENT ERROR:",
        clientError
    );


    if (
        clientError ||
        !client
    ) {

        showMessage(
            "Client account not found.",
            true
        );

        return;

    }


    /* --------------------------------------
       3. CLIENT NAME
    -------------------------------------- */

    clientNameElement.textContent =
        client.name ||
        "Your memories.";


    /* --------------------------------------
       4. GALLERY
    -------------------------------------- */

    const {
        data: galleryData,
        error: galleryError
    } =
        await supabaseClient
            .from("galleries")
            .select(
                "id, client_id, client_name"
            )
            .eq(
                "client_id",
                client.id
            )
            .single();


    console.log(
        "GALLERY:",
        galleryData
    );

    console.log(
        "GALLERY ERROR:",
        galleryError
    );


    if (
        galleryError ||
        !galleryData
    ) {

        showMessage(
            "Gallery not found.",
            true
        );

        return;

    }


    /* --------------------------------------
       5. PHOTOS
    -------------------------------------- */

    const {
        data: photos,
        error: photosError
    } =
        await supabaseClient
            .from("gallery_photos")
            .select(
                "id, gallery_id, file_path, file_name, created_at"
            )
            .eq(
                "gallery_id",
                galleryData.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    console.log(
        "PHOTOS:",
        photos
    );

    console.log(
        "PHOTOS ERROR:",
        photosError
    );


    if (photosError) {

        showMessage(
            "Could not load photos: " +
            photosError.message,
            true
        );

        return;

    }


    if (
        !photos ||
        photos.length === 0
    ) {

        showMessage(
            "No photos have been added to your gallery yet.",
            true
        );

        return;

    }


    /* --------------------------------------
       6. CREATE SIGNED URLS
    -------------------------------------- */

    galleryPhotos = [];


    for (
        const photo of photos
    ) {

        try {

            const {
                data: signedData,
                error: signedError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "client-galleries"
                    )
                    .createSignedUrl(
                        photo.file_path,
                        3600
                    );


            if (
                signedError ||
                !signedData ||
                !signedData.signedUrl
            ) {

                console.error(
                    "Signed URL error:",
                    photo.file_path,
                    signedError
                );

                continue;

            }


            galleryPhotos.push({

                id:
                    photo.id,

                url:
                    signedData.signedUrl,

                fileName:
                    photo.file_name ||
                    "Client photograph"

            });


        } catch (error) {

            console.error(
                "Photo error:",
                error
            );

        }

    }


    /* --------------------------------------
       7. CHECK PHOTOS
    -------------------------------------- */

    if (
        galleryPhotos.length === 0
    ) {

        showMessage(
            "Photos were found, but their secure URLs could not be created.",
            true
        );

        return;

    }


    /* --------------------------------------
       8. META
    -------------------------------------- */

    galleryMeta.textContent =
        galleryPhotos.length +
        (
            galleryPhotos.length === 1
                ? " PHOTOGRAPH"
                : " PHOTOGRAPHS"
        );


    /* --------------------------------------
       9. RENDER
    -------------------------------------- */

    renderGallery();

    showMessage("");

}


/* ==========================================
   RENDER GALLERY
========================================== */

function renderGallery() {

    gallery.innerHTML = "";


    galleryPhotos.forEach(
        (photo, index) => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "photo-wrapper loading";


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "photo";

            img.alt =
                photo.fileName;

            img.loading =
                "lazy";

            img.decoding =
                "async";


            img.addEventListener(
                "load",
                () => {

                    wrapper.classList.remove(
                        "loading"
                    );

                    img.classList.add(
                        "loaded"
                    );

                }
            );


            img.addEventListener(
                "error",
                () => {

                    wrapper.classList.remove(
                        "loading"
                    );

                    wrapper.style.display =
                        "none";

                }
            );


            img.src =
                photo.url;


            const overlay =
                document.createElement(
                    "div"
                );

            overlay.className =
                "photo-overlay";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "view-icon";

            icon.innerHTML =
                "⌕";


            overlay.appendChild(
                icon
            );


            wrapper.appendChild(
                img
            );

            wrapper.appendChild(
                overlay
            );


            wrapper.addEventListener(
                "click",
                () => {

                    openLightbox(
                        index
                    );

                }
            );


            gallery.appendChild(
                wrapper
            );

        }
    );

}


/* ==========================================
   OPEN LIGHTBOX
========================================== */

function openLightbox(
    index
) {

    if (
        !galleryPhotos.length
    ) {
        return;
    }


    currentPhotoIndex =
        index;


    updateLightbox();


    lightbox.classList.add(
        "active"
    );

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";

}


/* ==========================================
   UPDATE LIGHTBOX
========================================== */

function updateLightbox() {

    const photo =
        galleryPhotos[
            currentPhotoIndex
        ];


    if (!photo) {
        return;
    }


    lightboxImage.src =
        photo.url;

    lightboxImage.alt =
        photo.fileName;


    lightboxCounter.textContent =
        (
            currentPhotoIndex + 1
        ) +
        " / " +
        galleryPhotos.length;


    /*
       Hide arrows if only one photo
    */

    if (
        galleryPhotos.length <= 1
    ) {

        lightboxPrev.style.display =
            "none";

        lightboxNext.style.display =
            "none";

    } else {

        lightboxPrev.style.display =
            "flex";

        lightboxNext.style.display =
            "flex";

    }

}


/* ==========================================
   CLOSE LIGHTBOX
========================================== */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src =
        "";

    document.body.style.overflow =
        "";

}


/* ==========================================
   NEXT PHOTO
========================================== */

function nextPhoto() {

    if (
        !galleryPhotos.length
    ) {
        return;
    }


    currentPhotoIndex =
        (
            currentPhotoIndex + 1
        ) %
        galleryPhotos.length;


    updateLightbox();

}


/* ==========================================
   PREVIOUS PHOTO
========================================== */

function previousPhoto() {

    if (
        !galleryPhotos.length
    ) {
        return;
    }


    currentPhotoIndex =
        (
            currentPhotoIndex -
            1 +
            galleryPhotos.length
        ) %
        galleryPhotos.length;


    updateLightbox();

}


/* ==========================================
   BUTTON EVENTS
========================================== */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightboxNext.addEventListener(
    "click",
    nextPhoto
);


lightboxPrev.addEventListener(
    "click",
    previousPhoto
);


/* ==========================================
   CLICK BACKDROP
========================================== */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousPhoto();

        }

    }
);


/* ==========================================
   TOUCH / SWIPE
========================================== */

let touchStartX = 0;

let touchEndX = 0;


lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        handleSwipe();

    },
    {
        passive: true
    }
);


function handleSwipe() {

    const distance =
        touchEndX -
        touchStartX;


    if (
        Math.abs(distance) < 50
    ) {

        return;

    }


    if (
        distance < 0
    ) {

        nextPhoto();

    } else {

        previousPhoto();

    }

}


/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
    "click",
    async () => {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "LOGGING OUT...";


        const {
            error
        } =
            await supabaseClient
                .auth
                .signOut();


        if (error) {

            console.error(
                "Logout error:",
                error
            );

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "LOG OUT";

            return;

        }


        window.location.href =
            "client-login.html";

    }
